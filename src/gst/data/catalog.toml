# Game Study Toolkit - third-party tool catalog (versions verified 2026-10-05/07).
#
# kind:
#   winget      winget install --id <winget> -e --version <version>   (hash verified by winget)
#   zip         download <url>, verify <sha256>, extract to <tools_dir>/<id>/<version>
#   file        download a single file (exe/jar) to <tools_dir>/<id>/<version>
#   dotnet-tool dotnet tool install -g <package> --version <version>
#   uv-tool     uv tool install --python 3.13 <package>==<version>
#   npm         npm install --prefix <tools_dir>/<id>/<version> <spec> (spec = <package>@<version>; GST_<ID>_SPEC or
#               the config key <id>_spec selects another spec - an npm/GitHub spec or a local tarball -
#               installed in <tools_dir>/<id>/custom-<hash>)
#   builtin     ships with Windows or Visual Studio; only detected
#   guided      never installed automatically; `gst tools install <id>` and `gst tools info <id>` print the steps
# sha256: a hex digest, "github" (digest published on the GitHub release page) or "tofu"
#   (trust on first use: recorded in tools.lock.json, verified afterwards).
# search: glob patterns (forward slashes, env vars allowed) used to find binaries of installers
#   that do not report their install dir.
# policy: tags checked by gst before use - runtime (attaches to a live process), injection
#   (drops DLLs into a game folder: sandbox only), kernel-driver.

[tools."7zip"]
title = "7-Zip"
kind = "winget"
