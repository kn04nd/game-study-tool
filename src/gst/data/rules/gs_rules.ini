; Game Study Toolkit additions to the SteamDB FileDetectionRuleSets format.
; Same syntax: Name = regex  or  Name[] = regex ; comment. Matched case-insensitively against
; '/'-separated paths relative to the install folder. Covers engines and markers the SteamDB
; rules miss (verified against the local library on 2026-10-05).

[Engine]
CreationEngine[] = (?:^|/)data/[^/]+\.esm$ ; with .bsa/.ba2 archives (Skyrim, Fallout)
CreationEngine[] = (?:^|/)(?:skyrimse|fallout4|starfield|fallout3|falloutnv|oblivion)\.exe$
NoMansSkyEngine[] = (?:^|/)gamedata/pcbanks/nmsarc\.[^/]+\.pak$
NoMansSkyEngine[] = (?:^|/)binaries/nms\.exe$
BlizzardCASC[] = (?:^|/)data/\.build\.config$
BlizzardCASC[] = (?:^|/)\.build\.info$
BlizzardCASC[] = (?:^|/)data/\d{3}/0x[0-9a-f]+-meta\.dat$
ForzaTech[] = (?:^|/)media/zipmanifest\.xml$
ChromeEngine[] = (?:^|/)(?:engine|gamedll|filesystem)_x64_rwdi\.dll$ ; Techland Chrome Engine 6
RAGE[] = (?:^|/)title\.rgl$
RAGE[] = (?:^|/)(?:gta5|gta5_enhanced|rdr2|gtaiv|playgtav|playrdr2|playgtaiv)\.exe$
HashLink[] = (?:^|/)hlboot\.dat$
HashLink[] = (?:^|/)libhl\.dll$
Flash[] = \.swf$
PyInstaller[] = (?:^|/)_internal/python3\d+\.dll$
JavaGame[] = (?:^|/)jre(?:64)?/release$
GodotNET[] = (?:^|/)data_[^/]+_windows_x86_64/godotsharp\.dll$
RPGMaker2000[] = (?:^|/)rpg_rt\.(?:exe|ldb|lmt)$
WolfRPG[] = (?:^|/)data\.wolf$
WolfRPG[] = (?:^|/)data/basicdata\.wolf$
UnrealEngine3[] = (?:^|/)(?:cookedpc|cookedpcconsole)/
UnrealEngine3[] = \.upk$
Stingray[] = (?:^|/)data/bundle_database\.data$
Stingray[] = (?:^|/)data/bundles\.\d+\.nxa$

[AntiCheat]
EasyAntiCheat[] = (?:^|/)start_protected_game\.exe$
EasyAntiCheat[] = (?:^|/)easyanticheat/settings\.json$
EasyAntiCheat[] = (?:^|/)eac_launcher\.exe$
BattlEye[] = (?:^|/)battleye/
BattlEye[] = (?:^|/)[^/]+_be\.exe$
nProtect_GameGuard[] = (?:^|/)gameguard/
nProtect_GameGuard[] = (?:^|/)gamemon(?:64)?\.des$
XIGNCODE3[] = (?:^|/)xigncode/
XIGNCODE3[] = \.xem$
EA_Javelin[] = (?:^|/)eaanticheat\.(?:installer|gameservicelauncher)\.exe$
mhyprot[] = (?:^|/)mhyprot\d*\.sys$
mhyprot[] = (?:^|/)mhypbase\.dll$
Ricochet[] = (?:^|/)randgrid\.sys$
TencentACE[] = (?:^|/)(?:anticheatexpert|aceantibotclient)/
PunkBuster[] = (?:^|/)pb/pb(?:svc|cl)

[Launcher]
RockstarLauncher[] = (?:^|/)title\.rgl$
RockstarLauncher[] = (?:^|/)play(?:gtav|rdr2|gtaiv)\.exe$
BattleNet[] = (?:^|/)\.build\.info$

[Loader]
; Third-party injectors already present in the install (the install is already modified)
BepInEx[] = (?:^|/)bepinex/core/
BepInEx[] = (?:^|/)doorstop_config\.ini$
MelonLoader[] = (?:^|/)melonloader/
UE4SS[] = (?:^|/)ue4ss(?:-settings\.ini|\.dll)$
REFramework[] = (?:^|/)reframework/
ScriptExtender[] = (?:^|/)(?:skse64|skse|f4se|nvse|sfse|obse64|obse)_loader\.exe$
ScriptHook[] = (?:^|/)scripthook(?:v|rdr2)\.dll$
ASILoader[] = \.asi$
ReShade[] = (?:^|/)reshade\.ini$
ModEngine2[] = (?:^|/)modengine2_launcher\.exe$
