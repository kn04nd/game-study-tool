name: CI

# Every pull request (opened, new commits pushed, reopened) runs the test suite.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (Windows, Python 3.13)
    # gst is Windows-first: the runtime, Job Object and memory code use Win32 through ctypes.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Create the venv (docs/DEV.md)
        run: |
          uv venv .venv --python 3.13
          uv pip install --python .venv/Scripts/python.exe -e ".[full]" pytest

      - name: Unit tests
        # pyproject's addopts leave out -m tools (third-party tools) and -m games (installed games):
        # neither exists on a CI runner.
        run: .venv/Scripts/python -m pytest -ra
        env:
          # Study workspaces of the tests stay in the runner's temp folder, never in the default GS_HOME.
          GST_HOME: ${{ runner.temp }}\gst-home

      - name: No derived game material tracked
        run: .venv/Scripts/python scripts/check_no_derived.py
