[project]
name = "game-study-tool"
version = "0.1.0"
description = "gst - game-study-tool: extract and study everything from games you own (successor of game-study-toolkit gs)."
readme = "README.md"
requires-python = ">=3.12"  # shutil.rmtree(onexc=...), install.ps1 checks it
license = "MIT"
authors = [{ name = "Luis F K Andriolo" }]
# Core stays almost stdlib-only so `gst --help` and the hooks start fast.
dependencies = [
    "pefile>=2024.8.26",
]

[project.optional-dependencies]
# Pinned to match the catalog's kind="python" entries (tests/unit/test_tools.py checks).
index = [
    "tree-sitter==0.26.0",
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-c==0.24.2",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-java==0.23.5",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-lua==0.5.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-json==0.24.8",
    "tree-sitter-yaml==0.7.2",
]
unity = [
    "UnityPy[ttgen]==1.25.4",
    "pygltflib>=1.16",  # M2
]
formats = [
    "dissect.cstruct==4.7",
]
full = ["game-study-tool[index,unity,formats]"]

[project.scripts]
gst = "gst.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

# --- dependency additions by parallel phases (M1/M2/...): append in the lists above and
# --- mark with a trailing comment "# M1" / "# M2" so merges stay trivial (see docs/INTERFACES.md).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tools: needs installed third-party tools (gst selftest --tools)",
    "games: needs locally installed games (gst selftest --games)",
]
addopts = "-m 'not tools and not games' -q"
